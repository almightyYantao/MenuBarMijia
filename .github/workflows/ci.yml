name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：所有 job 只读。需要写权限的发布流程放在单独的 release 工作流里。
permissions:
  contents: read

# 同一个 PR / 分支只保留最新一次运行，节省 Runner 时间。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    # 验证密钥扫描、编码规范与 MijiaCore 全量单测（Ubuntu + Swift 6.1）
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Secret & coding-standard checks
        run: bash scripts/check.sh --lint-only
      - name: Test MijiaCore on Linux
        run: bash scripts/linux-check/run.sh

  windows-core:
    # 验证 Windows 版 TypeScript 核心测试与前端打包
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install & Test & Build Frontend
        run: npm ci && npm test && npm run build

  windows-installer:
    # 编译 Windows 安装包并保留为 CI 产物，发布时再上传到对应版本。
    runs-on: windows-latest
    needs: [windows-core, linux-core]
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "windows/src-tauri -> target"
      - name: Install frontend & Tauri CLI dependencies
        run: npm ci
      - name: Build Windows Tauri installer (.exe & .msi)
        run: npx tauri build -- --locked
      - name: Collect Windows installers
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < ../VERSION)"
          mkdir -p ../dist-windows
          cp src-tauri/target/release/bundle/nsis/*.exe "../dist-windows/MenuBarMijia-${version}-windows-x64-setup.exe"
          cp src-tauri/target/release/bundle/msi/*.msi "../dist-windows/MenuBarMijia-${version}-windows-x64.msi"
          cd ../dist-windows
          sha256sum "MenuBarMijia-${version}-windows-x64-setup.exe" > "MenuBarMijia-${version}-windows-x64-setup.exe.sha256"
          sha256sum "MenuBarMijia-${version}-windows-x64.msi" > "MenuBarMijia-${version}-windows-x64.msi.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MenuBarMijia-Windows-x64
          path: dist-windows/*

  macos:
    # 编译 App 层（Release -O 配置，#2 这类崩溃只在 -O 下出现）并运行全部单测。
    # Package.swift 需要 macOS 26 SDK；GitHub 托管的 macos-26 Runner 已于 2026-02-26 正式可用。
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain info
        run: xcodebuild -version && swift --version
      - name: Install ripgrep
        run: command -v rg >/dev/null || brew install ripgrep
      - name: Build app (release)
        run: swift build -c release --product MenuBarMijiaApp
      - name: Lint & test
        env:
          # 快照不一致时把差异图写到固定目录，便于作为 artifact 下载（#46）。
          SNAPSHOT_ARTIFACTS: "${{ github.workspace }}/snapshot-failed"
        run: bash scripts/check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: snapshot-diff
          path: snapshot-failed
          if-no-files-found: ignore

  snapshot-record:
    # 仅手动触发（workflow_dispatch）：以 record 模式渲染 UI 快照基线（#46）。
    # Record 模式下 SnapshotTesting 以非零码退出，属预期；把 PNG 从 artifact 下载后
    # 拷到 Tests/MenuBarMijiaAppTests/__Snapshots__/SnapshotTests/ 提交即可。
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SNAPSHOT_RECORD: "1"
      SNAPSHOT_ARTIFACTS: "${{ github.workspace }}/snapshot-failed"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record snapshot baselines
        continue-on-error: true
        run: swift test --filter SnapshotTests
      - name: Collect baselines
        if: always()
        run: |
          mkdir -p snapshot-baselines
          find Tests/MenuBarMijiaAppTests/__Snapshots__ -name '*.png' -exec cp {} snapshot-baselines/ \; 2>/dev/null || true
          ls snapshot-baselines | head -20
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: snapshot-baselines
          path: snapshot-baselines
